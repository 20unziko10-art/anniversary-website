[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the fingerprinted assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback so client-side routes (/universe, /celebration) work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
